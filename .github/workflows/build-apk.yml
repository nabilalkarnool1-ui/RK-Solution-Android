name: Build RK Solution APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Assemble edited four-child artwork
        run: |
          cat app/src/main/assets/kids_clock_edited.webp.part1 app/src/main/assets/kids_clock_edited.webp.part2 app/src/main/assets/kids_clock_edited.webp.part3 app/src/main/assets/kids_clock_edited.webp.part4 | base64 --decode > app/src/main/res/drawable-nodpi/kids_clock_edited.webp
          test -s app/src/main/res/drawable-nodpi/kids_clock_edited.webp
          file app/src/main/res/drawable-nodpi/kids_clock_edited.webp

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RK-Solution-edited-kids-widget-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
