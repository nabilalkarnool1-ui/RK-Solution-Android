<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#05070d"><title>RK Solution Kids Clock</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#05070d;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:18px}
.wrap{width:min(100%,680px);border:2px solid #a8b9d5;border-radius:34px;background:linear-gradient(145deg,#101827,#020307 55%);padding:22px;box-shadow:0 0 34px #168bff44,inset 0 0 24px #fff1}
.top{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}.clock{aspect-ratio:1;border:5px solid #dbe8ff;border-radius:50%;display:grid;place-items:center;position:relative;background:radial-gradient(circle,#101b2d,#03050a 70%);box-shadow:0 0 22px #39a9ff55}.clock:before{content:"";position:absolute;width:7px;height:7px;background:#ffbd43;border-radius:50%;z-index:3}.num{position:absolute;font-size:clamp(16px,4vw,25px);font-weight:700}.n12{top:5%}.n3{right:7%}.n6{bottom:5%}.n9{left:7%}.hand{position:absolute;bottom:50%;left:50%;transform-origin:bottom;border-radius:8px}.hour{height:27%;width:5px;background:#fff;transform:translateX(-50%) rotate(40deg)}.minute{height:38%;width:3px;background:#fff;transform:translateX(-50%) rotate(130deg)}.second{height:41%;width:2px;background:#ff4848;transform:translateX(-50%) rotate(210deg)}
.month{font-size:24px;font-weight:800;color:#ffd34f;text-align:center;letter-spacing:2px}.days,.dates{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:7px;margin-top:12px}.days{color:#a9c8ff;font-weight:700}.dates span{padding:5px 0;border-radius:50%;font-size:15px}.dates .today{background:#ef4545;font-weight:800}.bottom{border-top:1px solid #8da3c7;margin-top:22px;padding-top:18px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:center}.time{font-size:clamp(58px,17vw,116px);font-weight:850;letter-spacing:-5px;color:#78aaff;line-height:1}.info{font-size:clamp(16px,4vw,24px);font-weight:700}.date{color:#c8d8f5;font-size:14px;margin-top:8px}.brand{text-align:center;color:#93baff;letter-spacing:4px;font-size:11px;margin-top:18px}
@media(max-width:390px){.wrap{padding:14px}.top{gap:10px}.days,.dates{gap:3px}.dates span{font-size:12px}.month{font-size:18px}}
</style></head><body><main class="wrap"><section class="top"><div class="clock"><b class="num n12">12</b><b class="num n3">3</b><b class="num n6">6</b><b class="num n9">9</b><i class="hand hour" id="hh"></i><i class="hand minute" id="mm"></i><i class="hand second" id="ss"></i></div><div><div class="month" id="month"></div><div class="days"><span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span></div><div class="dates" id="dates"></div></div></section><section class="bottom"><div class="time" id="time">--:--</div><div class="info"><div id="weekday"></div><div class="date" id="fullDate"></div><div class="date">RK SOLUTION • KIDS CLOCK</div></div></section><div class="brand">FAMILY TIME • EVERY MOMENT</div></main>
<script>
function tick(){const d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds();document.getElementById('time').textContent=(h%12||12)+':'+String(m).padStart(2,'0');document.getElementById('hh').style.transform='translateX(-50%) rotate('+(h%12*30+m*.5)+'deg)';document.getElementById('mm').style.transform='translateX(-50%) rotate('+(m*6)+'deg)';document.getElementById('ss').style.transform='translateX(-50%) rotate('+(s*6)+'deg)';document.getElementById('weekday').textContent=d.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase();document.getElementById('fullDate').textContent=d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});const y=d.getFullYear(),mo=d.getMonth(),first=new Date(y,mo,1).getDay(),count=new Date(y,mo+1,0).getDate();document.getElementById('month').textContent=d.toLocaleDateString(undefined,{month:'long'}).toUpperCase()+' '+y;const el=document.getElementById('dates');if(el.dataset.month!==y+'-'+mo){el.innerHTML='';for(let i=0;i<first;i++)el.appendChild(document.createElement('span'));for(let n=1;n<=count;n++){let x=document.createElement('span');x.textContent=n;if(n===d.getDate())x.className='today';el.appendChild(x)}el.dataset.month=y+'-'+mo}else{el.querySelectorAll('.today').forEach(x=>x.className='');const cells=[...el.children];if(cells[first+d.getDate()-1])cells[first+d.getDate()-1].className='today'}}tick();setInterval(tick,1000);
</script></body></html>
